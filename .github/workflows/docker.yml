# ================================================================
# Docker images from main (snapshots). Release images (`latest`,
# `X.Y.Z`, `X.Y.Z-cpu/-gpu/-tpu`) are published by release.yml.
#
# Publishes on push to main:
#   averm004/tidevec:main, :sha-<commit>         (CPU, amd64 + arm64)
#   averm004/tidevec:main-gpu, :sha-<commit>-gpu (amd64)
#   averm004/tidevec:main-tpu, :sha-<commit>-tpu (amd64)
# Pull requests build the CPU image without pushing.
#
# Required GitHub Secrets:
#   DOCKER_USERNAME = averm004
#   DOCKER_PASSWORD = dckr_pat_xxxx  (Docker Hub access token)
# ================================================================

name: Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_REPO: averm004/tidevec
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:

  # ── CPU: native runner per arch, pushed by digest ───────────────
  build-cpu:
    name: Build CPU (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       docker/cpu/Dockerfile
          platforms:  ${{ matrix.platform }}
          outputs:    type=image,name=${{ env.DOCKERHUB_REPO }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=cpu-${{ matrix.platform }}
          cache-to:   type=gha,scope=cpu-${{ matrix.platform }},mode=max

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digest-cpu-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-cpu:
    name: CPU manifest
    runs-on: ubuntu-24.04
    needs: [build-cpu]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-cpu-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          refs=()
          for d in *; do refs+=("$DOCKERHUB_REPO@sha256:$d"); done
          docker buildx imagetools create \
            -t "$DOCKERHUB_REPO:main" -t "$DOCKERHUB_REPO:sha-$GITHUB_SHA" "${refs[@]}"
          docker buildx imagetools inspect "$DOCKERHUB_REPO:main"

  # ── GPU / TPU (amd64) ───────────────────────────────────────────
  build-accel:
    name: Build ${{ matrix.variant }} (amd64)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        variant: [gpu, tpu]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       docker/${{ matrix.variant }}/Dockerfile
          platforms:  linux/amd64
          push:       true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:main-${{ matrix.variant }}
            ${{ env.DOCKERHUB_REPO }}:sha-${{ github.sha }}-${{ matrix.variant }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to:   type=gha,scope=${{ matrix.variant }},mode=max

  # ── Docker Hub README update ────────────────────────────────────
  update-readme:
    name: Update Docker Hub README
    runs-on: ubuntu-24.04
    needs: [merge-cpu]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username:         ${{ secrets.DOCKER_USERNAME }}
          password:         ${{ secrets.DOCKER_PASSWORD }}
          repository:       ${{ env.DOCKERHUB_REPO }}
          readme-filepath:  ./docker/DOCKERHUB_README.md
          short-description: "TideVec: vector database for RAG and agents over changing knowledge"
