name: TideVec CI

# Tests and build checks on every push and PR. Publishing lives in
# release.yml (v* tags), which also calls this workflow as its test gate;
# Docker images for main are built by docker.yml.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip_wheels:
        description: Skip the embedded wheel jobs (release.yml builds its own)
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  # ================================================================
  # Version strings agree (server, CMake, Python, Java, C++, Docker, Helm)
  # ================================================================
  versions:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_release_versions.py

  # ================================================================
  # C++ build + test
  # ================================================================
  cpp-test:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            python3 python3-pip

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DTIDEVEC_BUILD_TESTS=ON \
            -DTIDEVEC_MARCH=x86-64-v3 \
            -GNinja

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ./build/tidevec_tests

      - name: Scale tests
        run: ./build/tidevec_scale_tests

      - name: API tests
        run: timeout 120 ./build/tidevec_api_tests

      - name: Accel tests
        run: ./build/tidevec_accel_tests

      - name: Durability / Raft tests
        run: timeout 300 ./build/tidevec_eleven_nines_tests

      - name: Upload server binary for SDK tests
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: tidevec-server-linux
          path: build/tidevec-server
          retention-days: 3

  # ================================================================
  # Python SDK — unit, embedded-mode and live-server tests
  # (including the experimental 3-node Raft cluster test)
  # ================================================================
  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    needs: [cpp-test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: tidevec-server-linux
          path: build

      - name: Install SDK, embedded engine and integrations
        run: |
          chmod +x build/tidevec-server
          ./scripts/sync_embedded_headers.sh
          pip install ./sdk/python-embedded
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            # mcp and langchain-core 1.x need Python >= 3.10; those tests skip.
            pip install -e "sdk/python[dev,numpy]"
          else
            pip install -e "sdk/python[dev,numpy,langchain,llamaindex,mcp]"
          fi

      - name: pytest
        working-directory: sdk/python
        env:
          TIDEVEC_SERVER_BIN: ${{ github.workspace }}/build/tidevec-server
        run: python -m pytest -q -rs

      - name: README snippet against the server
        if: matrix.python-version == '3.12'
        env:
          TIDEVEC_API_KEY: ci-smoke-key
        run: |
          D=$(mktemp -d)
          build/tidevec-server --host 127.0.0.1 --port 16399 --data-dir "$D" \
            --api-key "$TIDEVEC_API_KEY" --require-auth --backup-dir "$D/backups" &
          python scripts/release_smoke_test.py --server 127.0.0.1:16399
          python scripts/release_smoke_test.py --embedded
          kill %1

  # ================================================================
  # Python distributions build cleanly
  # ================================================================
  python-dist:
    name: Python dists (tidevec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build and check
        run: |
          pip install build twine
          python -m build sdk/python --outdir dist
          twine check --strict dist/*

  # ================================================================
  # Embedded engine wheels (tidevec-embedded) — Linux + macOS.
  # The storage layer uses POSIX I/O, so Windows is not supported yet.
  # ================================================================
  embedded-wheels:
    name: Embedded wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [python-sdk]
    if: ${{ !inputs.skip_wheels }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Vendor headers into the package
        run: ./scripts/sync_embedded_headers.sh

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: sdk/python-embedded
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686"
          CIBW_ARCHS_MACOS: arm64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=13.3
          CIBW_BEFORE_TEST: pip install {project}/sdk/python
          CIBW_TEST_COMMAND: python {project}/scripts/release_smoke_test.py --embedded

      - uses: actions/upload-artifact@v4
        with:
          name: tidevec-embedded-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 30

  embedded-sdist:
    name: Embedded sdist
    runs-on: ubuntu-22.04
    needs: [python-sdk]
    if: ${{ !inputs.skip_wheels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build sdist (headers vendored)
        run: |
          ./scripts/sync_embedded_headers.sh
          pip install build twine
          python -m build --sdist sdk/python-embedded --outdir dist-embedded
          twine check --strict dist-embedded/*
      - uses: actions/upload-artifact@v4
        with:
          name: tidevec-embedded-sdist
          path: dist-embedded/*.tar.gz
          retention-days: 30

  # ================================================================
  # Docs site (MkDocs Material). The REST reference is generated from
  # include/tidevec/api/rest_server.hpp and must be up to date.
  # ================================================================
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: API reference is current
        run: python scripts/gen_api_docs.py --check
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7

  # ================================================================
  # C++ SDK — headers compile, example builds, Conan recipe exports
  # (the release archive is attached to the GitHub Release by release.yml)
  # ================================================================
  cpp-sdk:
    name: C++ SDK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential cmake ninja-build g++

      - name: Verify headers compile (C++20)
        run: |
          cat > /tmp/test_sdk.cpp << 'CPPEOF'
          #include "tidevec/tidevec.hpp"
          int main() {
              // Compile-time type checks
              static_assert(tidevec::HalfLife::ONE_WEEK == 604800000LL);
              static_assert(tidevec::HalfLife::ONE_DAY  == 86400000LL);
              tidevec::CollectionConfig cfg{
                  .name         = "test",
                  .dim          = 768,
                  .half_life_ms = tidevec::HalfLife::ONE_WEEK,
              };
              tidevec::SearchOptions opts{
                  .top_k          = 10,
                  .temporal_blend = 0.3f,
              };
              tidevec::Vector v{
                  .id        = "v1",
                  .embedding = {0.1f, 0.2f, 0.3f},
              };
              return 0;
          }
          CPPEOF
          g++ -std=c++20 -I${{ github.workspace }}/sdk/cpp/include /tmp/test_sdk.cpp -o /tmp/test_sdk
          echo "C++ SDK headers compile cleanly"

      - name: Build example
        run: |
          g++ -std=c++20 -Isdk/cpp/include sdk/cpp/examples/quickstart.cpp \
            -o /tmp/quickstart -lpthread
          ls -lh /tmp/quickstart

      - name: Validate Conan recipe
        run: |
          pip install conan -q
          conan profile detect --force
          conan export sdk/cpp --name tidevec --version 0.3.0

  # ================================================================
  # Go SDK — REST client, tested against a live server.
  # The module is released by pushing an sdk/go/vX.Y.Z tag (release.yml).
  # ================================================================
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-22.04
    needs: [cpp-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/download-artifact@v4
        with:
          name: tidevec-server-linux
          path: build

      - name: gofmt / vet / test
        working-directory: sdk/go
        env:
          TIDEVEC_SERVER_BIN: ${{ github.workspace }}/build/tidevec-server
        run: |
          chmod +x "$TIDEVEC_SERVER_BIN"
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test -count=1 -v ./...

  # ================================================================
  # Java SDK — zero-dependency REST client, tested against a live
  # server. Published by release.yml.
  # ================================================================
  java-sdk:
    name: Java SDK
    runs-on: ubuntu-22.04
    needs: [cpp-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/download-artifact@v4
        with:
          name: tidevec-server-linux
          path: build

      - name: Test and package
        working-directory: sdk/java
        env:
          TIDEVEC_SERVER_BIN: ${{ github.workspace }}/build/tidevec-server
        run: |
          chmod +x "$TIDEVEC_SERVER_BIN"
          mvn -B verify --no-transfer-progress
          ls -lh target/*.jar

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidevec-java-${{ github.sha }}
          path: sdk/java/target/tidevec-java-*.jar
          retention-days: 30

  # ================================================================
  # Security scan
  # ================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      actions:         read
      contents:        read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref:  .
          severity:  CRITICAL,HIGH
          format:    sarif
          output:    trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
