{{- if not .Values.secrets.existingSecret }}
{{- $apiKey := .Values.secrets.apiKey | default (include "tidevec.existingSecretValue" (dict "ctx" . "key" "api-key")) | default (printf "tv_%s" (randAlphaNum 40)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tidevec.secretName" . }}
  labels:
    {{- include "tidevec.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  api-key: {{ $apiKey | quote }}
  {{- if .Values.cluster.enabled }}
  cluster-secret: {{ .Values.cluster.secret | default (include "tidevec.existingSecretValue" (dict "ctx" . "key" "cluster-secret")) | default (randAlphaNum 48) | quote }}
  {{- end }}
{{- end }}
