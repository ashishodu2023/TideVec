apiVersion: v1
kind: Service
metadata:
  name: {{ include "tidevec.fullname" . }}
  labels:
    {{- include "tidevec.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tidevec.selectorLabels" . | nindent 4 }}
---
# Stable per-pod DNS for the StatefulSet (and Raft peers in cluster mode).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tidevec.headlessName" . }}
  labels:
    {{- include "tidevec.labels" . | nindent 4 }}
    tidevec.com/headless: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 6399
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tidevec.selectorLabels" . | nindent 4 }}
