apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tidevec.fullname" . }}-config
  labels:
    {{- include "tidevec.labels" . | nindent 4 }}
data:
  TIDEVEC_PORT: "6399"
  TIDEVEC_THREADS: {{ .Values.config.threads | quote }}
  TIDEVEC_DEVICE: {{ .Values.config.device | quote }}
  TIDEVEC_REQUIRE_AUTH: {{ ternary "1" "0" .Values.config.requireAuth | quote }}
  TIDEVEC_ULTRA_DURABLE: {{ ternary "1" "0" .Values.config.ultraDurable | quote }}
  TIDEVEC_SEGMENT_STORE: {{ ternary "1" "0" .Values.config.segmentStore | quote }}
  TIDEVEC_MULTI_TENANT: {{ ternary "1" "0" .Values.config.multiTenant | quote }}
  TIDEVEC_BACKUP: {{ ternary "1" "0" .Values.backup.enabled | quote }}
  TIDEVEC_BACKUP_INTERVAL_HOURS: {{ .Values.backup.intervalHours | quote }}
  TIDEVEC_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.tls.enabled }}
  TIDEVEC_TLS_CERT: "/tls/tls.crt"
  TIDEVEC_TLS_KEY: "/tls/tls.key"
  {{- end }}
  TIDEVEC_DATA_DIR: "/data"
  TIDEVEC_BACKUP_DIR: "/backups"
  {{- if gt (int .Values.config.rateLimitRps) 0 }}
  TIDEVEC_RATE_LIMIT: {{ .Values.config.rateLimitRps | quote }}
  {{- end }}
  {{- with .Values.config.otelEndpoint }}
  TIDEVEC_OTEL_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.reembedAllow }}
  TIDEVEC_REEMBED_ALLOW: {{ . | quote }}
  {{- end }}
  {{- with .Values.backup.s3Uri }}
  TIDEVEC_BACKUP_S3: {{ . | quote }}
  {{- end }}
  {{- with .Values.backup.gcsUri }}
  TIDEVEC_BACKUP_GCS: {{ . | quote }}
  {{- end }}
  {{- if .Values.cluster.enabled }}
  TIDEVEC_RAFT_PEERS: {{ include "tidevec.raftPeers" . | quote }}
  {{- end }}
