[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Thin launcher so MCP clients can run `uvx tidevec-mcp` (the MCP registry
# runs `uvx <package>`, so the executable must match the package name).
# All code lives in the `tidevec` package.
[project]
name            = "tidevec-mcp"
version         = "0.3.0"
description     = "TideVec agent-memory MCP server — long-term memory that knows when facts change"
readme          = "README.md"
license         = { text = "Apache-2.0" }
authors         = [{ name = "Ashish Verma", email = "contact@tidevec.com" }]
requires-python = ">=3.10"
keywords        = ["mcp", "model-context-protocol", "agent-memory", "tidevec", "claude", "cursor"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["tidevec[mcp,embedded]==0.3.0"]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=2.2"]

[project.scripts]
tidevec-mcp = "tidevec.mcp_server:main"

[project.urls]
Homepage   = "https://tidevec.com"
Repository = "https://github.com/ashishodu2023/TideVec"

[tool.hatch.build.targets.wheel]
bypass-selection = true
